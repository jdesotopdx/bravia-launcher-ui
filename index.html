<!doctype html>
<!-- screens update independently of the launcher APK -->
<html lang="en" data-theme="berry"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home</title>
<style>
@font-face{font-family:Inter;font-weight:300;src:url(fonts/Inter-Light.otf)}
@font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter-Regular.otf)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/Inter-Medium.otf)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-SemiBold.otf)}
/* Two color schemes. Berry by night, honey by day; Auto follows Portland's real sunrise and sunset. */
html[data-theme=berry]{--bg0:#0c0208;--bg1:#32092b;--bg2:#561244;--g1:240,38,146;--g2:124,52,214;
  --ink:#fff7fb;--dim:#cfa9c2;--accent:#ffd23f;--tile:#3a1830;--panel:#2b0e24;--pill:rgba(28,14,25,.8);
  --chip:rgba(255,255,255,.08);--chipon:rgba(255,255,255,.2);--focusbg:#fff;--focusfg:#160912;
  --ring:150,205,255;--glow:110,185,255;--bar:rgba(40,24,36,.9);--noimg:#3a1830;--overlay:rgba(22,9,18,.992);--vig:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,0));
  --toast:rgba(34,19,30,.95);--toastfg:#f7eef3;--faux:#3a2434;--glass:rgba(255,255,255,.1)}
html[data-theme=honey]{--bg0:#f1dba8;--bg1:#e5be72;--bg2:#d4963a;--g1:255,160,40;--g2:255,222,140;
  --ink:#1f1306;--dim:#664a22;--accent:#8a4400;--tile:#fff7e6;--panel:#fff8ea;--pill:rgba(255,248,232,.8);
  --chip:rgba(43,26,8,.12);--chipon:rgba(43,26,8,.22);--focusbg:#1f1306;--focusfg:#fff7e6;
  --ring:176,92,0;--glow:240,130,10;--bar:rgba(255,247,230,.9);--noimg:#f2e3c4;--overlay:rgba(247,235,210,.992);--vig:radial-gradient(ellipse at 50% 42%,rgba(120,70,20,0) 45%,rgba(90,45,8,.34) 100%);
  --toast:rgba(43,30,13,.92);--toastfg:#fff7e6;--faux:#e6cf9f;--glass:rgba(255,255,255,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg0);overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg0);overflow:hidden}
#sky{position:absolute;inset:0;background:linear-gradient(160deg,var(--bg0),var(--bg1) 55%,var(--bg2))}
#sky i{position:absolute;width:1500px;height:1500px;border-radius:50%;display:block}
#sky i:first-child{left:-420px;top:-620px;background:radial-gradient(circle,rgba(var(--g1),.55),rgba(var(--g1),0) 68%);animation:driftA 60s ease-in-out infinite}
#sky i:last-child{right:-520px;bottom:-700px;background:radial-gradient(circle,rgba(var(--g2),.5),rgba(var(--g2),0) 68%);animation:driftB 60s ease-in-out infinite}
html[data-theme=honey] #sky::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(120,70,20,0) 45%,rgba(90,45,8,.34) 100%)}
@keyframes driftA{0%,100%{transform:translate(0,0)}50%{transform:translate(140px,90px)}}
@keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-120px,-110px)}}
#page{position:absolute;left:0;top:0;width:1920px;height:1080px}
.abs{position:absolute}
/* Title row: the clock is the title, the date beside it, round buttons on the right. */
#clock{left:96px;top:46px;font-size:84px;font-weight:600;letter-spacing:-2.5px;line-height:1}
#date{left:96px;top:148px;font-size:26px;font-weight:500;color:var(--dim)}
#wx{right:96px;top:150px;font-size:24px;color:var(--dim);white-space:pre;text-align:right}
#events{left:560px;top:52px;height:80px;display:flex;gap:56px}
.ev .d{font-size:17px;font-weight:600;color:var(--accent);letter-spacing:.5px;text-transform:uppercase}
.ev .t{font-size:23px;font-weight:500;margin-top:3px}
.ev .h{font-size:21px;color:var(--dim);margin-top:2px}
#hdrbtns{right:96px;top:56px;display:flex;gap:20px}
.hb{width:64px;height:64px;border-radius:32px;background:var(--chip);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.hb svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hb.f{background:var(--focusbg);transform:scale(1.12);box-shadow:0 0 0 4px rgba(var(--ring),.9),0 0 36px rgba(var(--glow),.8)}
.hb.f svg{stroke:var(--focusfg)}
/* Rows under the title: Today's question, then the picks. */
#pill{left:96px;top:206px;width:1728px;height:52px;border-radius:26px;background:var(--pill);display:flex;align-items:center;gap:32px;padding:0 36px}
#pill b{font-size:17px;font-weight:600;color:var(--accent);letter-spacing:.8px}
#pill span{font-size:25px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ptabs{left:96px;top:292px;display:flex;gap:40px}
.pt{font-size:28px;font-weight:500;color:var(--dim);padding:6px 2px;border-radius:12px}
.pt.on{color:var(--ink);font-weight:600}
.pt.f{background:var(--focusbg);color:var(--focusfg);padding:6px 22px;margin:0 -20px}
#picks{left:96px;top:356px;display:flex;gap:28px;width:1728px;height:400px;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.pk{flex:none;width:252px}
.pk .im{width:252px;height:378px;border-radius:20px;overflow:hidden;background:var(--tile);position:relative;transition:transform .16s}
.pk .im img{width:100%;height:100%;object-fit:cover;display:block}
.pk.hero{width:812px}
.pk.hero .im{width:812px}
.pk.hero .bg{position:absolute;inset:0;background:linear-gradient(120deg,var(--tint,#3a2c3f),#120e16)}
.pk.hero .im img{position:absolute;left:0;top:0;width:252px;height:378px;box-shadow:16px 0 48px rgba(0,0,0,.35)}
.pk.hero .cap{position:absolute;left:300px;right:40px;top:0;bottom:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.45));margin-left:-48px;padding-left:48px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:36px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.pk.hero .cap .t{font-size:42px;font-weight:600;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pk.hero .cap .s{font-size:24px;margin-top:10px;opacity:.85}
.pk .bar{position:absolute;left:16px;right:16px;bottom:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.pk .bar i{display:block;height:100%;border-radius:3px;background:#fff}
.pk .mdc{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:32px 28px;background:var(--chip);color:var(--ink)}
.pk .mdc b{font-size:40px;font-weight:600;letter-spacing:-.6px;line-height:1.1}
.pk .mdc span{font-size:24px;line-height:1.3;color:var(--dim)}
.pk .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--noimg);color:var(--dim);font-size:22px;padding:20px;text-align:center}
.pk .tt{margin-top:14px;font-size:24px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .lf{font-size:20px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.f .im{transform:scale(1.03);box-shadow:0 0 0 4px rgba(var(--ring),.95),0 0 40px rgba(var(--glow),.85)}
.empty{font-size:22px;color:var(--dim);padding:40px 4px}
/* The shelf: a glass bar with wide, label-free app tiles. */
#shelf{left:64px;top:858px;width:1792px;height:174px;border-radius:40px;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 20px 60px rgba(0,0,0,.18);overflow:hidden}
#apps{position:absolute;left:39px;top:25px;display:flex;gap:22px;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.app{width:226px;height:124px;flex:none;border-radius:20px;overflow:hidden;background:var(--tile);position:relative;transition:transform .16s}
.app img{width:100%;height:100%;display:block;object-fit:cover}
.app .sq{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.app .sq img{width:118px;height:118px;border-radius:0}
.app .sq .blur{display:none}.app .sq{background:var(--tile)}
#picks,#apps{will-change:transform}.app{contain:paint}
.app .sq img.fg{position:relative;width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.app.f{transform:scale(1.08);box-shadow:0 0 0 4px rgba(var(--ring),.95),0 0 40px rgba(var(--glow),.85)}
.faux{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#3a8bff,#1f5fe0)}
.faux svg{width:52%;height:52%;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round}
.faux.ltr{background:var(--faux);color:var(--ink);font-size:30px;font-weight:600;letter-spacing:-.5px}
.faux.ltr.disney{background:#0b1a3a;color:#fff}
.faux.ltr.hulu{background:#1ce783;color:#040405}
/* Drawer grid tiles reuse the square icon look. */
.ic{width:135px;height:135px;border-radius:30px;overflow:hidden;background:var(--tile);transition:transform .16s}
.ic img{width:100%;height:100%;display:block;object-fit:cover}
.gapp{width:135px;text-align:center}
.gapp .nm{margin:12px 0 0 -12px;width:159px;font-size:22px;font-weight:500;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gapp.f .ic{transform:scale(1.06);box-shadow:0 0 0 4px rgba(var(--ring),.95),0 0 40px rgba(var(--glow),.85)}
.gapp.f .nm{color:var(--ink);font-weight:600}
.pst{width:192px;flex:none}
.pp{width:192px;height:288px;border-radius:16px;overflow:hidden;transition:transform .16s;background:var(--tile)}
.pp img{width:100%;height:100%;object-fit:cover;display:block}
.pst.f .pp{transform:scale(1.05);box-shadow:0 0 0 4px rgba(var(--ring),.95),0 0 40px rgba(var(--glow),.85)}
/* Full-screen overlays: the app drawer, settings and Movie Match share one surface. */
.ov{position:absolute;inset:0;background:var(--vig),radial-gradient(circle at 8% 0%,rgba(var(--g1),.5),rgba(var(--g1),0) 45%),radial-gradient(circle at 100% 100%,rgba(var(--g2),.45),rgba(var(--g2),0) 45%),linear-gradient(160deg,var(--bg0),var(--bg1) 55%,var(--bg2));display:none;z-index:5}
.ov.on{display:block}
#dh{left:96px;top:56px;font-size:54px;font-weight:600}
#tabs{left:96px;top:140px;display:flex;gap:14px}
.tab{padding:12px 30px;border-radius:30px;font-size:24px;font-weight:500;color:var(--dim);background:var(--chip)}
.tab.on{color:var(--ink);background:var(--chipon)}
.tab.f{background:var(--focusbg);color:var(--focusfg);box-shadow:0 0 0 4px rgba(var(--ring),.9)}
#grid{left:66px;top:206px;width:1788px;height:850px;overflow:hidden;padding:30px}
#gin{display:grid;grid-template-columns:repeat(8,135px);column-gap:24px;row-gap:56px;transition:transform .25s}
#grid{top:206px}
#empty{left:96px;top:260px;font-size:28px;color:var(--dim)}
/* The menu: rows with a label and a value, the focused row in the ink color. Used by every list in the launcher. */
.mrow{height:74px;margin-bottom:8px;border-radius:18px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;font-size:28px;font-weight:500;background:var(--chip);color:var(--ink)}
.mrow .v{color:var(--dim);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.mrow.f{background:var(--focusbg);color:var(--focusfg)}
.mrow.f .v{color:var(--focusfg);opacity:.72}
.mrow.big{height:104px;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;position:relative}
.mrow.big .sub{font-size:22px;font-weight:400;color:var(--dim)}
.mrow.big.f .sub{color:var(--focusfg);opacity:.72}
.mrow.big .chk{position:absolute;right:30px;top:36px;font-size:30px}
.mhead{font-size:18px;font-weight:600;letter-spacing:.8px;color:var(--accent);text-transform:uppercase;margin-bottom:16px}
.hint{font-size:21px;color:var(--dim);margin-top:16px;line-height:1.35}
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}
#sheet.on{display:block}
#sbox{position:absolute;left:660px;top:240px;width:600px;background:var(--panel);border-radius:28px;padding:30px}
#sbox h3{font-size:28px;font-weight:600;margin-bottom:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sopts .mrow{height:64px;font-size:26px;padding:0 24px}
/* Settings: title and status on the left, the list on the right. */
#st{left:96px;top:120px;width:800px}
#st h1{font-size:72px;font-weight:600;letter-spacing:-1.5px;line-height:1}
#st .sub{font-size:28px;color:var(--dim);margin-top:12px}
#st .blk{margin-top:64px}
.cmp{display:grid;grid-template-columns:300px 160px 160px;row-gap:12px;font-size:24px}
.cmp .h{color:var(--dim);font-size:20px;font-weight:600}
.cmp .n{font-weight:500}
.nt{font-size:22px;line-height:1.35;margin-bottom:12px}
.nt small{display:block;color:var(--dim);font-size:19px;margin-top:2px}
#sl{left:1000px;top:186px;width:824px}
#sl h2{font-size:28px;font-weight:600;margin:0 30px 20px}
/* Movie Match */
#mh{left:96px;top:72px;font-size:54px;font-weight:600}
#msub{left:96px;top:146px;font-size:28px;color:var(--dim)}
#who{left:0;top:280px;width:1920px;display:flex;justify-content:center;gap:48px}
.card{width:420px;flex:none;text-align:center}
.card .ph{width:420px;height:560px;border-radius:32px;overflow:hidden;background:var(--tile);transition:transform .16s;display:flex;align-items:center;justify-content:center}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph b{font-size:150px;font-weight:600;color:var(--dim)}
.card .nm{font-size:32px;font-weight:600;margin-top:20px}
.card.f .ph{transform:scale(1.04);box-shadow:0 0 0 4px rgba(var(--ring),.95),0 0 48px rgba(var(--glow),.85)}
#vote{left:0;top:200px;width:1920px;display:none;justify-content:center;align-items:center;gap:72px}
#vote.on{display:flex}
.vb{width:300px;height:120px;border-radius:60px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600;color:var(--dim)}
.vb.f{background:var(--focusbg);color:var(--focusfg);box-shadow:0 0 0 4px rgba(var(--ring),.9),0 0 36px rgba(var(--glow),.8)}
#vp{width:480px;height:720px;border-radius:28px;overflow:hidden;background:var(--tile);box-shadow:0 30px 80px rgba(0,0,0,.35)}
#vp img{width:100%;height:100%;object-fit:cover;display:block}
#vt{left:0;top:948px;width:1920px;text-align:center;font-size:34px;font-weight:600}
#vy{left:0;top:996px;width:1920px;text-align:center;font-size:24px;color:var(--dim)}
#res{left:96px;top:240px;display:flex;gap:24px;width:1728px;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
#rhint{left:96px;top:940px;font-size:24px;color:var(--dim)}
/* Film page: trailer on top, where to watch below. */
#ftr{left:96px;top:96px;width:960px;height:540px;border-radius:28px;overflow:hidden;background:#000 center/cover no-repeat;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#ftr iframe{width:100%;height:100%;border:0;display:block;transform:scale(1.16)}
#finfo{left:1104px;top:96px;width:720px}
#finfo h1{font-size:64px;font-weight:600;letter-spacing:-1.2px;line-height:1.05}
#finfo .y{font-size:28px;color:var(--dim);margin-top:12px}
#finfo .fr{font-size:34px;font-weight:600;color:var(--accent);margin-top:26px;line-height:1.25}
#finfo .rt{font-size:28px;margin-top:14px;color:var(--dim)}#finfo .rt b{color:#00e054;margin-right:16px}
#finfo .tgl{font-size:24px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-top:22px}
#finfo .sy{font-size:26px;line-height:1.42;margin-top:12px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
#finfo .cs{font-size:24px;line-height:1.4;color:var(--dim);margin-top:16px}
#finfo .tip{font-size:24px;line-height:1.4;color:var(--dim);margin-top:28px}
#ftr{transition:left .25s,top .25s,width .25s,height .25s,border-radius .25s}
#ftr.big{left:0;top:0;width:1920px;height:1080px;border-radius:0;z-index:3;box-shadow:none}
#mdh{left:96px;top:72px;font-size:54px;font-weight:600}
#mdsub{left:96px;top:146px;font-size:28px;color:var(--dim)}
#mdopts{left:96px;top:280px;width:1728px;display:flex;gap:24px}
.mo{flex:1;min-width:0;height:420px;border-radius:32px;padding:40px 36px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;background:var(--chip);color:var(--ink)}
.mo .a{font-size:46px;font-weight:600;letter-spacing:-.8px;line-height:1.08}
.mo .b{font-size:26px;line-height:1.3;color:var(--dim)}
.mo.f{background:var(--focusbg);color:var(--focusfg);box-shadow:0 0 0 4px rgba(var(--ring),.9),0 0 36px rgba(var(--glow),.8)}
.mo.f .b{color:inherit;opacity:.8}
#mdres{left:80px;top:226px;width:1760px;height:710px;overflow:hidden}
#mdin{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;padding:10px 16px 0;transition:transform .25s ease}
.mr{flex:1;min-width:0}
.mr .pp{width:100%;height:auto;aspect-ratio:2/3;border-radius:22px}
.mr.f .pp{transform:scale(1.04);box-shadow:0 0 0 4px rgba(var(--ring),.95),0 0 40px rgba(var(--glow),.85)}
.mr .tt{margin-top:18px;font-size:28px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr .nt{margin-top:6px;font-size:22px;line-height:1.3;color:var(--dim)}
.mr .av{margin-top:8px;font-size:22px;font-weight:600;color:var(--accent)}
#mdhint{left:96px;top:980px;font-size:24px;color:var(--dim)}
#lb{background:#14181c;--ink:#e9eef2;--dim:#9ab;--chip:#2c3440;--focusbg:#e9eef2;--focusfg:#14181c;--ring:0,224,84;--glow:0,224,84;--accent:#00e054;color:#e9eef2}
#lbtop{left:80px;top:48px;width:1760px;height:84px;display:flex;align-items:center;gap:20px}
.lgo{display:flex}.lgo i{width:34px;height:34px;border-radius:50%;margin-right:-8px;display:block}
.lw{font-size:44px;font-weight:700;letter-spacing:-.8px;margin-left:16px;margin-right:48px}
.lts{display:flex;gap:12px}
.lt{padding:12px 30px;border-radius:999px;background:var(--chip);color:var(--ink);font-size:28px;font-weight:600}
.lt.on{background:#00e054;color:#14181c}
.lt.f{box-shadow:0 0 0 4px #e9eef2,0 0 30px rgba(0,224,84,.7)}
#lbbody{left:72px;top:152px;width:1776px;height:900px;overflow:hidden}
#lwrap{height:100%;overflow:hidden;padding-top:8px}
#lchips+#lwrap{height:calc(100% - 76px)}
#lchips{display:flex;gap:14px;align-items:center;padding:6px 24px 16px;height:76px;box-sizing:border-box}
#lchips .lt{font-size:26px;padding:10px 26px}
#lchips .lt.f{background:#e9eef2;color:#14181c}
.lcount{font-size:26px;color:var(--dim);margin-left:16px}
#lgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:24px;padding:16px 24px 0;transition:transform .25s ease}
#lgrid.l4{grid-template-columns:repeat(4,1fr)}
#lwrap #lgrid{margin-top:0}
.lc{min-width:0;flex:none}
.lc .pp{width:100%;aspect-ratio:2/3;border-radius:14px;background:#2c3440 center/cover}
.lc .pp img{width:100%;height:100%;object-fit:cover;display:block;border-radius:14px}
.lc.f .pp{transform:scale(1.04);box-shadow:0 0 0 4px #00e054,0 0 40px rgba(0,224,84,.7)}
.lc .tt{margin-top:14px;font-size:26px;font-weight:600;font-family:Georgia,'Times New Roman',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .nt{margin-top:4px;font-size:22px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .st{color:#00e054;font-weight:700;margin-left:10px}
.lc .av{margin-left:10px;color:#40bcf4}
#lhome{transition:transform .25s ease}
#lbbody.nt *{transition:none!important}
.lr{height:500px;overflow:hidden}
.lrt{font-size:30px;font-weight:700;letter-spacing:.4px;padding:10px 24px 12px;color:#9ab;text-transform:uppercase;font-size:24px}

<script>

window.__fit=fit;
addEventListener('resize',fit);fit();setInterval(fit,1000);

// ---------- theme: honey by day, berry by night ----------
var LAT=45.55,LON=-122.65;
function sunTimes(d){ // NOAA sunrise equation, local noon as the anchor; returns [sunrise,sunset] as Date
  var rad=Math.PI/180,noon=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
  var jd=noon.getTime()/86400000+2440587.5,n=Math.round(jd-2451545.0+0.0008),js=n-LON/360;
  var M=(357.5291+0.98560028*js)%360,C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  var L=(M+C+180+102.9372)%360,jt=2451545.0+js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*L*rad);
  var sd=Math.sin(L*rad)*Math.sin(23.4397*rad),dec=Math.asin(sd);
  var cw=(Math.sin(-0.833*rad)-Math.sin(LAT*rad)*sd)/(Math.cos(LAT*rad)*Math.cos(dec));
  cw=Math.max(-1,Math.min(1,cw));var w=Math.acos(cw)/rad;
  var toMs=function(j){return (j-2440587.5)*86400000};
  return[new Date(toMs(jt-w/360)),new Date(toMs(jt+w/360))];
}
function themePref(){return TV.get('theme')||'auto'}
function applyTheme(){
  var p=themePref(),t=p;
  if(p==='auto'){var now=new Date(),s=sunTimes(now);t=(now>=s[0]&&now<s[1])?'honey':'berry'}
  if(document.documentElement.getAttribute('data-theme')!==t)document.documentElement.setAttribute('data-theme',t);
}
function cycleTheme(dir){var o=['auto','honey','berry'],i=o.indexOf(themePref());i=(i+(dir||1)+3)%3;TV.set('theme',o[i]);applyTheme()}
function themeLabel(){var p=themePref();if(p==='auto'){var t=document.documentElement.getAttribute('data-theme');return 'Auto · '+(t==='honey'?'Honey now':'Berry now')}return p==='honey'?'Honey':'Berry'}

// ---------- data ----------
var DATA={cw:[],tonight:[],lists:[],gems:[],events:[],prompts:['']};
var W=[];
function loadWatchNext(){W=[];try{var r=JSON.parse(TV.watchNext());if(r==='noperm'){W.noperm=true}else if(Array.isArray(r))W=r}catch(e){}}
var DEFAULT_PINS=[
 {p:'com.netflix.ninja',l:'Netflix',i:'netflix'},{p:'com.amazon.amazonvideo.livingroom',l:'Prime Video',i:'primevideo'},
 {p:'com.google.android.youtube.tv',l:'YouTube',i:'youtube'},{p:'com.plexapp.android',l:'Plex',i:'plex'},
 {p:'com.wbd.stream',l:'Max',i:'max'},{p:'com.rosetofilms.tvbrowser',l:'Browser',i:'browser'},
 {p:'com.letterboxd.letterboxd',l:'Letterboxd',i:'letterboxd'},{p:'app.moviematch',l:'Movie Match',i:'mm'},
 {p:'com.kanopy.tvapp',l:'Kanopy',i:'kanopy'},{p:'com.mubi',l:'Mubi',i:'mubi'},{p:'com.apple.atve.sony.appletv',l:'Apple TV',i:'appletv'},
 {p:'com.disney.disneyplus',l:'Disney+',i:'disneyplus'},{p:'com.hulu.livingroomplus',l:'Hulu',i:'hulu'},
 {p:'com.wnba.centercourt',l:'WNBA'},{p:'com.peacocktv.peacockandroid',l:'Peacock'},{p:'com.cbs.ott',l:'Paramount+'}];
var BUILT={};DEFAULT_PINS.forEach(function(d){if(d.i)BUILT[d.p]=d.i});
var HIDE_RE=/^(com\.sony\.|com\.sonypicturescore|com\.sonyericsson\.|com\.google\.android\.play\.games|com\.google\.android\.videos|tv\.samba\.)/;
/* Pins added after the first release: saved pin lists on the TV get them once. */
var PIN_ADDS=[{v:2,pins:['com.disney.disneyplus','com.hulu.livingroomplus']},{v:3,pins:['com.wnba.centercourt']},{v:4,pins:['com.peacocktv.peacockandroid','com.cbs.ott']}];
var S={apps:[],installed:{},pins:[],hidden:[],zone:'apps',i:{top:0,tabs:0,picks:0,apps:0},ptab:'tonight',drawer:false,tab:'all',gi:0,tabf:true,sheet:null,sheetI:0,
  set:{on:false,screen:'main',i:0},mm:null,mode:{}};

function loadState(){
  try{S.apps=JSON.parse(TV.apps())}catch(e){S.apps=[]}
  S.installed={};S.apps.forEach(function(a){S.installed[a.p]=a});
  S.pins=jget('pins',null)||DEFAULT_PINS.slice();
  S.hidden=jget('hidden',null);
  if(!S.hidden){S.hidden=S.apps.filter(function(a){return HIDE_RE.test(a.p)}).map(function(a){return a.p});jset('hidden',S.hidden)}
  var pv=parseInt(TV.get('pins_v')||'1',10),changed=false;
  PIN_ADDS.forEach(function(add){
    if(pv>=add.v)return;
    add.pins.forEach(function(p){
      if(!S.pins.some(function(x){return x.p===p})){var d=DEFAULT_PINS.filter(function(x){return x.p===p})[0];if(d)S.pins.push({p:d.p,l:d.l,i:d.i})}
      S.hidden=S.hidden.filter(function(x){return x!==p});
    });
    pv=add.v;changed=true;
  });
  if(changed){jset('pins',S.pins);jset('hidden',S.hidden);TV.set('pins_v',String(pv))}
}
function iconSrc(p,builtKey){
  if(builtKey==='browser')return null;
  var d='';try{d=TV.icon(p)}catch(e){}
  if(d)return d;
  if(builtKey)return 'icons/'+builtKey+'.png';
  var k=BUILT[p];if(k&&k!=='browser')return 'icons/'+k+'.png';
  return null;
}
var GLOBE='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>';
function iconHTML(p,key,label){
  var s=iconSrc(p,key);
  if(s)return '<img src="'+s+'">';
  if(key==='browser'||p==='com.rosetofilms.tvbrowser')return '<div class="faux">'+GLOBE+'</div>';
  return '<div class="faux ltr" style="font-size:56px;font-weight:600">'+(label||'?').charAt(0)+'</div>';
}
/* A shelf tile: the app's 16:9 banner when it ships one, else its square icon on a blur of itself. */
var BANNERS=['netflix','youtube','primevideo','plex','max','letterboxd','kanopy','mubi','appletv','disneyplus','hulu','mm'];
function tileHTML(p,key,label){
  // Native first: the app's own 16:9 banner, as Google TV's shelf shows it. Then its icon; the bundled art is last.
  var b='';try{b=TV.banner?TV.banner(p):''}catch(e){}
  if(b)return '<img src="'+b+'">';
  var bk=key||BUILT[p];if(bk&&BANNERS.indexOf(bk)>=0)return '<img src="icons/banner/'+bk+'.png">';
  var n='';try{n=TV.icon(p)}catch(e){}
  var s=n||iconSrc(p,key);
  if(s)return '<div class="sq"><div class="blur" style="background-image:url('+s+')"></div><img class="fg" src="'+s+'"></div>';
  if(key==='browser'||p==='com.rosetofilms.tvbrowser')return '<div class="faux">'+GLOBE+'</div>';
  var cls=p==='com.disney.disneyplus'?' disney':p==='com.hulu.livingroomplus'?' hulu':'';
  return '<div class="faux ltr'+cls+'">'+esc(label||'?')+'</div>';
}

// ---------- home render ----------
var PTABS=[{id:'tonight',l:'Tonight'},{id:'cw',l:'Continue watching'},{id:'gems',l:'Hidden gems'},{id:'mood',l:'In the mood'}];
function picks(){
  if(S.ptab==='cw')return W.map(function(c){return{t:c.t,sub:c.sub,img:c.img,data:true,p:c.p,portrait:c.portrait,w:c}});
  if(S.ptab==='mood')return MD_MOODS.map(function(m){return{t:m.a,sub:m.b,mood:m.id}});
  var src=S.ptab==='gems'?(DATA.gems||[]):DATA.tonight;
  return src.map(function(c){return{t:c.t,sub:c.y||'',img:'posters/'+c.img+'.jpg',it:c}});
}
function pickImg(c){return c.img?'<img src="'+c.img.replace(/"/g,'&quot;')+'">':'<div class="noimg">'+esc(c.t)+'</div>'}
function heroTint(){
  try{var im=document.querySelector('.pk.hero .im img'),bg=document.querySelector('.pk.hero .bg');if(!im||!bg)return;
    var go=function(){try{var c=document.createElement('canvas');c.width=c.height=1;var x=c.getContext('2d');x.drawImage(im,0,0,1,1);var d=x.getImageData(0,0,1,1).data;
      bg.style.setProperty('--tint','rgb('+Math.round(d[0]*.6)+','+Math.round(d[1]*.6)+','+Math.round(d[2]*.6)+')')}catch(e){}};
    if(im.complete)go();else im.onload=go}catch(e){}
}
function renderPicks(){
  var list=picks(),h='';
  $('#ptabs').innerHTML=PTABS.map(function(t,n){return '<div class="pt'+(S.ptab===t.id?' on':'')+(S.zone==='tabs'&&S.i.tabs===n?' f':'')+'">'+t.l+'</div>'}).join('');
  if(!list.length){
    $('#picks').innerHTML='<div class="empty">'+(S.ptab==='cw'?(W.noperm?'Allow TV listings access so Netflix, Prime and Plex can show up here':'Start something in Netflix, Prime Video or Plex and it appears here'):S.ptab==='gems'?'Hidden gems arrive with the Letterboxd sync':'Add films to your Letterboxd watchlist and they show up here')+'</div>';
    return;
  }
  list.forEach(function(c,n){

    h+='<div class="pk" data-n="'+n+'"><div class="im">'+pickImg(c)+bar+'</div><div class="tt">'+esc(c.t)+'</div><div class="lf">'+esc(c.sub||'')+'</div></div>';
  });
  $('#picks').innerHTML=h;
}
function renderHome(){
  $('#apps').innerHTML=S.pins.map(function(a,n){return '<div class="app" data-n="'+n+'">'+tileHTML(a.p,a.i,a.l)+'</div>'}).join('');
  loadWatchNext();

  $('#events').innerHTML=(DATA.events||[]).slice(0,3).map(function(e){
    return '<div class="ev"><div class="d">'+esc(e.d)+'</div><div class="t">'+esc(e.t)+'</div><div class="h">'+esc(e.h||'')+'</div></div>'}).join('');

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tick(){
  var d=new Date(),h=d.getHours()%12||12,m=('0'+d.getMinutes()).slice(-2);
  $('#clock').textContent=h+':'+m;
  $('#date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  var tz=d.getTimezoneOffset(),day=Math.floor((d.getTime()-tz*60000)/86400000),P=DATA.prompts;
  $('#q').textContent=P[day%P.length];
  applyTheme();
}
function weather(){
  try{fetch('https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=1')
  .then(function(r){return r.json()}).then(function(j){
    var c=j.current.weather_code,w=c==0?'Clear':c<4?'Partly cloudy':c<50?'Foggy':c<70?'Rain':c<80?'Snow':'Showers';
    $('#wx').textContent=Math.round(j.current.temperature_2m)+'°  '+w+'   H '+Math.round(j.daily.temperature_2m_max[0])+'  L '+Math.round(j.daily.temperature_2m_min[0]);
  }).catch(function(){})}catch(e){}
}

// ---------- focus ----------
function focusHome(){
  document.querySelectorAll('#page .f').forEach(function(e){e.classList.remove('f')});
  var z=S.zone,el=null,n=S.i[z];
  if(z==='top')el=(n===0?$('#bMM'):n===1?$('#bApps'):$('#bSet'));
  if(z==='tabs')el=$('#ptabs').children[n];
  if(z==='picks')el=$('#picks').children[n];
  if(z==='apps')el=$('#apps').children[n];
  if(el)el.classList.add('f');
  // Picks: every card is 252 wide on a 280 pitch; keep the focused card on screen.
  var list=picks(),x=0;
  if(z==='picks'&&n>=5)x=-((n-5)*280);
  $('#picks').style.transform='translateX('+x+'px)';
  var a=S.i.apps,vis=7,total=S.pins.length,sh=Math.min(Math.max(0,total-vis),Math.max(0,a-(vis-2)))*248;
  $('#apps').style.transform='translateX('+(z==='apps'?-sh:0)+'px)';
}
function lens(){return{top:3,tabs:PTABS.length,picks:picks().length,apps:S.pins.length}}

// ---------- drawer ----------
function drawerList(){
  var hid=S.hidden;
  return S.apps.filter(function(a){return a.p!=='com.rosetofilms.home'}).filter(function(a){
    var isH=hid.indexOf(a.p)>=0;return S.tab==='hid'?isH:!isH}).sort(function(a,b){return a.l.localeCompare(b.l)});
}
function openDrawer(tab){S.drawer=true;S.tab=tab||'all';S.gi=0;S.tabf=false;renderDrawer();$('#over').classList.add('on')}
function closeDrawer(){S.drawer=false;$('#over').classList.remove('on');S.sheet=null;$('#sheet').classList.remove('on')}
function renderDrawer(){
  var list=drawerList();
  $('#dh').textContent=S.tab==='hid'?'Hidden apps':'All apps';
  $('#tabs').innerHTML=['all','hid'].map(function(t){return '<div class="tab'+(S.tab===t?' on':'')+(S.tabf&&S.tab===t?' f':'')+'">'+(t==='all'?'All':'Hidden')+'</div>'}).join('');
  $('#gin').innerHTML=list.map(function(a,n){
    return '<div class="gapp'+(!S.tabf&&n===S.gi?' f':'')+'"><div class="ic">'+iconHTML(a.p,null,a.l)+'</div><div class="nm">'+esc(a.l)+'</div></div>'}).join('');
  $('#empty').textContent=list.length?'':(S.tab==='hid'?'Nothing hidden.':'No apps.');
  var row=Math.floor(S.gi/8),sh=Math.max(0,row-2)*(135+56+34);
  $('#gin').style.transform='translateY('+(-sh)+'px)';
}
function drawerKey(k){
  var list=drawerList(),n=list.length;
  if(S.tabf){
    if(k==='ArrowLeft'||k==='ArrowRight'){S.tab=S.tab==='all'?'hid':'all';S.gi=0}
    if(k==='ArrowDown'&&n){S.tabf=false}
    renderDrawer();return;
  }
  var c=S.gi;
  if(k==='ArrowRight')c=Math.min(n-1,c+1);
  if(k==='ArrowLeft')c=Math.max(0,c-1);
  if(k==='ArrowDown')c=Math.min(n-1,c+8);
  if(k==='ArrowUp'){if(c<8){S.tabf=true}else c-=8}
  S.gi=c;renderDrawer();
}

function jwLocal(img){try{var j=JSON.parse(localStorage.getItem('jw:'+img)||'null');if(j&&Date.now()-j.t<7*864e5)return j}catch(e){}return null}
function watchFor(it){var L=jwLocal(it.img);if(L)return L.o.length||L.tr?{trailer:L.tr||null,offers:L.o}:null;var W=window.__WATCH||{};return W[it.img]||null}
function jwNorm(t){return (t||'').toLowerCase().normalize('NFKD').replace(/&/g,'and').replace(/[^a-z0-9]/g,'')}
function jwPick(edges,t,y){var T=jwNorm(t),best=null,sc=0;edges.forEach(function(x){var c=x.node.content,n=jwNorm(c.title),dy=Math.abs((c.originalReleaseYear||0)-y),v=0;
  if(n===T)v=dy<=1?100:dy<=3?60:30;else if((n.indexOf(T)===0||T.indexOf(n)===0)&&Math.min(n.length,T.length)>=6)v=dy<=2?50:0;else if(dy===0&&(n.indexOf(T)>=0||T.indexOf(n)>=0)&&Math.min(n.length,T.length)>=5)v=40;
  if(v>sc){sc=v;best=x.node}});return sc>=40?best:null}
function jwQuery(s,cb){
  var Q='query($s:String!){popularTitles(country:US,first:10,filter:{searchQuery:$s,objectTypes:[MOVIE,SHOW]}){edges{node{content(country:US,language:en){title originalReleaseYear clips{externalId provider}} offers(country:US,platform:WEB){monetizationType retailPrice(language:en) standardWebURL package{clearName}}}}}}';
  var id='jw'+Date.now()+Math.random();HTTPCB[id]=function(st,t){var e=[];try{e=JSON.parse(t).data.popularTitles.edges||[]}catch(x){}cb(st===200,e)};
  try{TV.http(id,'https://apis.justwatch.com/graphql','POST',JSON.stringify({query:Q,variables:{s:s}}),'{"Content-Type":"application/json"}')}catch(x){cb(false,[])}
}
function jwLookup(it,cb){
  if(typeof TV==='undefined'||!TV.http){cb(null);return}
  var y=+it.y||0;
  jwQuery(it.t,function(ok,e){
    var h=jwPick(e,it.t,y);
    if(h||!ok){done(ok,h);return}
    var t2=it.t.replace(/^[^:]+:\s*/,'');if(t2===it.t){done(ok,null);return}
    jwQuery(t2,function(ok2,e2){done(ok2,jwPick(e2,t2,y))});
  });
  function done(ok,h){
    if(!ok){cb(null);return}
    var out={t:Date.now(),o:[],tr:null};
    if(h){
      (h.content.clips||[]).some(function(c){if(/youtube/i.test(c.provider||'')){out.tr=c.externalId;return true}});
      var best={};(h.offers||[]).forEach(function(o){
        var mt=o.monetizationType,k=mt==='FLATRATE'?'sub':mt==='FREE'?'free':mt==='RENT'?'rent':mt==='BUY'?'buy':'';if(!k)return;
        var n=(o.package||{}).clearName||'';if(k==='free'&&!/kanopy|hoopla/i.test(n))return;
        var rp=o.retailPrice||'',x=parseFloat(rp.replace(/[^0-9.]/g,''))||999,key=n+'|'+k;
        if(!best[key]||x<best[key].x)best[key]={n:n,k:k,p:k==='sub'?'Included':k==='free'?'Free':rp,u:o.standardWebURL,x:x};
      });
      Object.keys(best).forEach(function(k){var o=best[k];delete o.x;out.o.push(o)});
    }
    try{localStorage.setItem('jw:'+it.img,JSON.stringify(out))}catch(x){}
    cb(out);
  }
}
var APKG={'Netflix':'com.netflix.ninja','Netflix Standard with Ads':'com.netflix.ninja','Amazon Prime Video':'com.amazon.amazonvideo.livingroom','Amazon Prime Video with Ads':'com.amazon.amazonvideo.livingroom','Amazon Video':'com.amazon.amazonvideo.livingroom','Prime Video':'com.amazon.amazonvideo.livingroom','Kanopy':'com.kanopy.tvapp','Plex':'com.plexapp.android','Apple TV':'com.apple.atve.sony.appletv','Apple TV Store':'com.apple.atve.sony.appletv','Max':'com.wbd.stream','HBO Max':'com.wbd.stream','Hulu':'com.hulu.livingroomplus','Disney Plus':'com.disney.disneyplus','Disney+':'com.disney.disneyplus','YouTube':'com.google.android.youtube.tv','MUBI':'com.mubi','Mubi':'com.mubi','Letterboxd':'com.letterboxd.letterboxd','Peacock':'com.peacocktv.peacockandroid','Peacock Premium':'com.peacocktv.peacockandroid','Paramount Plus':'com.cbs.ott','Paramount+':'com.cbs.ott'};
function filmRows(w){
  var rows=[];
  var KL={free:'',sub:'Stream ',rent:'Rent ',buy:'Buy '};
  if(w&&w.offers&&w.offers.length){
    // House rules: no Fandango, no ad tiers, rentals only from Apple TV and Amazon, one row per service.
    var seen={},of=w.offers.filter(function(o){
      if(/fandango|vudu|with ads|flixfling|redbox|microsoft|plex|tubi|roku/i.test(o.n))return false;
      if((o.k==='rent'||o.k==='buy')&&!/apple tv|amazon/i.test(o.n))return false;
      var key=o.n.toLowerCase().replace(/ (standard|basic|premium).*$/,'')+'|'+o.k;if(seen[key])return false;seen[key]=1;return true}),pr=function(o){var m=/\$([0-9.]+)/.exec(o.p);return m?parseFloat(m[1]):99};
    var free=of.filter(function(o){return o.k==='free'}).sort(function(a,b){return (/kanopy|hoopla/i.test(b.n)?1:0)-(/kanopy|hoopla/i.test(a.n)?1:0)}).slice(0,3);

    of.forEach(function(o){if(pick.length<5&&pick.indexOf(o)<0&&(o.k==='rent'||o.k==='free'||(o.k==='sub'&&HAVE.test(o.n))))pick.push(o)});
    pick.slice(0,5).forEach(function(o){rows.push({n:o.n.replace(/^The /,'').replace(/^Amazon Prime Video/,'Prime Video').replace(/ at Home$/,''),p:(KL[o.k]||'')+o.p,u:o.u,free:o.k==='free',pkg:APKG[o.n]})});

function ytFind(it,cb){

      openSheet(p.l,[
        {l:'Move left',f:function(){if(n>0){var t=S.pins[n];S.pins[n]=S.pins[n-1];S.pins[n-1]=t;S.i.apps=n-1;savePins();renderHome()}}},
        {l:'Move right',f:function(){if(n<S.pins.length-1){var t=S.pins[n];S.pins[n]=S.pins[n+1];S.pins[n+1]=t;S.i.apps=n+1;savePins();renderHome()}}},
        {l:'Remove from shelf',f:function(){S.pins.splice(n,1);S.i.apps=Math.max(0,n-1);savePins();renderHome()}},
        {l:'Cancel',f:function(){}}]);
    }else open(p.p,p.l);
    return;
  }
  var c=picks()[n];if(!c)return;
  if(c.mood){openMood(c.mood);return}
  if(c.w){
    var w=c.w;
    if(long){openSheet(w.t,[{l:'Resume',v:w.app,f:function(){TV.launchUri(w.uri,w.pkg)}},{l:'Open '+w.app,f:function(){TV.launch(w.pkg)}},{l:'Cancel',f:function(){}}]);return}
    if(w.uri)TV.launchUri(w.uri,w.pkg);else TV.launch(w.pkg);
    return;
  }
  titleSheet(c.it);
}
function key(k){
  if(S.sheet)return sheetKey(k);
  if(S.film)return filmKey(k);
  if(S.lb)return lbKey(k);
  if(S.md)return moodKey(k);
  if(S.set.on)return settingsKey(k);
  if(S.mm)return matchKey(k);
  if(S.drawer)return drawerKey(k);
  var z=S.zone,L=lens();
  if(k==='ArrowRight')S.i[z]=Math.min(L[z]-1,S.i[z]+1);
  if(k==='ArrowLeft')S.i[z]=Math.max(0,S.i[z]-1);
  var order=['top','tabs','picks','apps'].filter(function(x){return x!=='picks'||L[x]>0}),zi=order.indexOf(z);
  if(zi<0){zi=0}
  if(k==='ArrowDown'){S.zone=order[Math.min(order.length-1,zi+1)]}
  if(k==='ArrowUp'){S.zone=order[Math.max(0,zi-1)];if(S.zone==='top')S.i.top=1}
  S.i[S.zone]=Math.max(0,Math.min((L[S.zone]||1)-1,S.i[S.zone]));
  focusHome();
}
function goBack(){
  if(S.sheet){closeSheet();return}
  if(S.film){if(S.film.big){closeBig()}else closeFilm();return}
  if(S.lb){lbBack();return}
  if(S.md){moodBack();return}
  if(S.set.on){if(S.set.screen!=='main'){S.set.screen='main';S.set.i=0;renderSettings()}else closeSettings();return}
  if(S.mm){matchBack();return}
  if(S.drawer){closeDrawer();return}
  if(S.zone!=='apps'||S.i.apps){S.zone='apps';S.i.apps=0;focusHome()}
}
// The TV calls onBack for the Back button and, on older launcher builds, for the Home button too. Home arrives with a resume right behind it, so a short wait tells them apart.
var backT=null,backAt=0;
window.onBack=function(){
  if(Date.now()-backAt<300)return;
  clearTimeout(backT);backT=setTimeout(function(){backT=null;goBack()},140);
};
// Screen updates: ask for them on every Home press or return, then swap in the new screens as soon as they land.
var bootHtml=null,lastAsk=0;
function screensNow(cb){try{var x=new XMLHttpRequest();x.open('GET','index.html?t='+Date.now());x.onload=function(){cb(x.responseText||'')};x.send()}catch(e){}}
function idleHome(){return !S.film&&!S.lb&&!S.md&&!S.mm&&!S.sheet&&!S.drawer&&!(S.set&&S.set.on)}
function askUpdates(){
  if(Date.now()-lastAsk<60000)return;lastAsk=Date.now();
  try{TV.checkUpdates()}catch(e){return}
  [15000,40000,90000].forEach(function(ms){setTimeout(function(){screensNow(function(h){if(bootHtml&&h&&h!==bootHtml&&idleHome())location.reload()})},ms)});
}
window.onHome=function(){askUpdates();
  clearTimeout(backT);backT=null;
  if(S.sheet)closeSheet();
  if(S.film)closeFilm();
  if(S.lb)closeLb();
  if(S.md)closeMood();
  if(S.mm)closeMatch();
  if(S.set.on){S.set.screen='main';S.set.i=0;closeSettings()}
  if(S.drawer)closeDrawer();
  if(!S.zone)S.zone='apps';focusHome();
};
window.onResume=function(){askUpdates();if(backT){clearTimeout(backT);backT=null;window.onHome();return}if(Date.now()-shuffledAt>10*60*1000){reshuffle();S.i.picks=0}loadState();renderHome();applyTheme();if(S.drawer)renderDrawer();if(S.set.on){modeState();renderSettings()}};

var hold=null,held=false;
addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='Enter'||k===' '||k==='Select'){
    e.preventDefault();
    if(!hold){held=false;hold=setTimeout(function(){held=true;press(true)},600)}
    return;
  }
  if(k==='Escape'||k==='Backspace'||k==='GoBack'){e.preventDefault();backAt=Date.now();goBack();return}
  if(k==='MediaPlayPause'){e.preventDefault();playPause();return}
  if(k==='MediaPlay'){e.preventDefault();playPause('play');return}
  if(k==='MediaPause'){e.preventDefault();playPause('pause');return}
  if(/^Arrow/.test(k)){e.preventDefault();key(k)}
},true);
addEventListener('keyup',function(e){
  var k=e.key;
  if(k==='Enter'||k===' '||k==='Select'){
    e.preventDefault();
    if(hold){clearTimeout(hold);hold=null;if(!held)press(false);held=false}
  }
},true);

// ---------- boot ----------
function mergeJw(){
  try{
    if(typeof TV==='undefined'||!TV.jwData)return;
    var J=JSON.parse(TV.jwData()||'{}'),W=window.__WATCH=window.__WATCH||{};
    Object.keys(J).forEach(function(h){var j=J[h];if(!j||!j.o)return;var o=W[h]||{};if(j.o.length||j.tr)W[h]={t:o.t,trailer:j.tr||o.trailer||null,offers:j.o.length?j.o:(o.offers||[])}});
  }catch(e){}
}
function jwStart(){
  try{
    if(typeof TV==='undefined'||!TV.jwSync)return;
    var f=LBd().f,a=Object.keys(f).map(function(h){return [h,f[h].t,+f[h].y||0]});
    (DATA.tonight||[]).concat(DATA.gems||[]).forEach(function(c){if(!f[c.img])a.push([c.img,c.t,+c.y||0])});
    TV.jwSync(JSON.stringify(a));
  }catch(e){}
}
window.onJw=function(){mergeJw();if(S.lb)renderLb();renderHome()};
var shuffledAt=0;
function reshuffle(){ // Tonight: 30 fresh picks from the whole watchlist, avoiding what the last launches showed
  var pool=DATA.pool||[];if(pool.length<30)return;
  var seen=[];try{seen=JSON.parse(localStorage.getItem('shown')||'[]')}catch(e){}
  var fresh=pool.filter(function(c){return seen.indexOf(c.img)<0});
  if(fresh.length<30){fresh=pool.slice();seen=[]}
  for(var i=fresh.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=fresh[i];fresh[i]=fresh[j];fresh[j]=t}
  DATA.tonight=fresh.slice(0,30);shuffledAt=Date.now();
  try{localStorage.setItem('shown',JSON.stringify(seen.concat(DATA.tonight.map(function(c){return c.img})).slice(-150)))}catch(e){}
}
Promise.resolve().then(function(){if(window.__DATA){var D=window.__DATA;Object.keys(D).forEach(function(k){DATA[k]=D[k]})}reshuffle();mergeJw();jwStart()}).then(function(){
  applyTheme();loadState();renderHome();tick();weather();setInterval(tick,15000);screensNow(function(h){bootHtml=h});setInterval(askUpdates,30*60*1000);setInterval(weather,1800000);
});
window.__S=S;window.__key=key;window.__press=press;window.__open=open;window.__openFilm=openFilm;window.__theme=function(t){TV.set('theme',t);applyTheme()};
})();
</script></body></html>
